name: Validate Templates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    name: Validate template structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - name: Validate templates
        run: node _scripts/validate-templates.js

      - name: Check RBAC codegen outputs
        run: node _scripts/rbac-codegen.js --check

  build-frontends:
    name: Build ${{ matrix.template }}/${{ matrix.frontend }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - template: cms
            frontend: nextjs
          - template: cms
            frontend: nuxt
          - template: cms
            frontend: astro
          - template: cms
            frontend: sveltekit
          - template: cms-i18n
            frontend: nextjs
          - template: cms-i18n
            frontend: nuxt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Check for changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            frontend:
              - '${{ matrix.template }}/${{ matrix.frontend }}/**'

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ matrix.template }}/${{ matrix.frontend }}
        run: pnpm install --frozen-lockfile

      - name: Create .env from .env.example
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ matrix.template }}/${{ matrix.frontend }}
        run: |
          if [ -f .env.example ]; then
            cp .env.example .env
          fi

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ matrix.template }}/${{ matrix.frontend }}
        run: pnpm build

  changeset:
    name: Check for a changeset
    # Exempt: the Version Packages PR (it removes changesets; a fork can reuse the branch name, so check
    # the repo too) and dependabot
    if: >-
      github.event_name == 'pull_request'
      && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.4
          package-manager-cache: false

      - run: npm ci

      # Fails when a starter changed without a changeset. Run `npx changeset` (or `npx changeset --empty` if it needs no release).
      - run: npx changeset status --since "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}
